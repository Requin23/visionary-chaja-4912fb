<link rel="manifest" href="/manifest.json" />

<script>

const uiState = {
  loadingProfiles: false,
  loadingMessages: false,
};

function formatMsgTime(dateString) {
  const date = new Date(dateString);

  return date.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit",
  });
}

async function sendLikeRequest(profile) {
  const user = currentUser();

  await supabaseFetch('/rest/v1/like_requests', {
    method: 'POST',
    body: [
      {
        sender_user_id: user.id,
        receiver_user_id: profile.user_id,
        status: 'pending'
      }
    ]
  });

  showToast('Like envoyé ❤️');
}

async function loadPendingLikes() {
  const user = currentUser();

  const response = await supabaseFetch(
    `/rest/v1/like_requests?receiver_user_id=eq.${user.id}&status=eq.pending`
  );

  state.pendingLikes = response || [];

  renderPendingLikes();
}

function renderPendingLikes() {
  const container = document.getElementById('pendingLikes');

  if (!container) return;

  container.innerHTML = state.pendingLikes
    .map((like) => `
      <div class="pending-like-card">
        <p>Nouveau like reçu ❤️</p>

        <button onclick="acceptLike('${like.id}')">
          Accepter
        </button>

        <button onclick="rejectLike('${like.id}')">
          Refuser
        </button>
      </div>
    `)
    .join('');
}

async function acceptLike(likeId) {
  const like = state.pendingLikes.find((x) => x.id === likeId);

  if (!like) return;

  await supabaseFetch(
    `/rest/v1/like_requests?id=eq.${likeId}`,
    {
      method: 'PATCH',
      body: {
        status: 'accepted'
      }
    }
  );

  await supabaseFetch('/rest/v1/matches', {
    method: 'POST',
    body: [
      {
        user_a_id: like.sender_user_id,
        user_b_id: like.receiver_user_id
      }
    ]
  });

  showToast('Match créé ❤️');

  await loadMatches();
}

async function rejectLike(likeId) {
  await supabaseFetch(
    `/rest/v1/like_requests?id=eq.${likeId}`,
    {
      method: 'PATCH',
      body: {
        status: 'rejected'
      }
    }
  );

  showToast('Like refusé');

  await loadPendingLikes();
}

setInterval(async () => {
  if (!state.auth?.refresh_token) {
    return;
  }

  try {
    await tryRefreshToken();
  } catch (error) {
    console.error(error);
  }
}, 1000 * 60 * 15);

function startRealtimeNotifications(realtimeClient) {

  realtimeClient
    .channel('likes-realtime')
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'like_requests'
      },
      async (payload) => {

        const request = payload.new;

        if (request.receiver_user_id === currentUser().id) {

          showToast('Nouveau like reçu ❤️');

          await loadPendingLikes();
        }
      }
    )
    .subscribe();
}

</script>
